# TLS is terminated by nginx-proxy; this container only sees plain HTTP.
# Relative redirects: otherwise nginx would build "http://<host>/dir/" for directory redirects (/linux -> /linux/).
absolute_redirect off;

gzip on;
gzip_vary on;
gzip_types text/plain text/css application/json application/javascript text/javascript text/xml application/xml image/svg+xml;

# Language of the KozMUL docs by the Accept-Language header.
map $http_accept_language $lang {
    default en;
    ~ru     ru;
}

# Names that aren't listed below (nginx-proxy only routes the listed ones here anyway).
server {
    listen 80 default_server;
    return 444;
}

# These redirects are mostly executed by the Cloudflare Redirect Rules.
# The server only has to answer the rest, including the 404 errors.
server {
    listen 80;
    server_name sadbot.ru www.sadbot.ru;

    location = / {
        return 301 https://kozalo.ru;
    }

    location /linux {
        return 301 https://files.sadbot.ru$request_uri;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    server_name cbt.sadbot.ru;
    root /srv/cbt;
}

server {
    listen 80;
    server_name comics.sadbot.ru;
    root /srv/comics;
}

server {
    listen 80;
    server_name nekochan.sadbot.ru;
    root /srv/nekochan;
}

server {
    listen 80;
    server_name kozmul.sadbot.ru;
    root /srv/kozmul;

    location = / {
        rewrite ^ /$lang;
    }
}

server {
    listen 80;
    server_name files.sadbot.ru;
    root /srv/files;
    autoindex on;
}

server {
    listen 80;
    server_name lib.sadbot.ru libs.sadbot.ru;
    return 301 https://files.sadbot.ru$request_uri;
}
